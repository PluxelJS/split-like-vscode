packages:
  - "packages/*"
allowBuilds:
  core-js: false
  es5-ext: false
overrides:
  "vitest@*": 5.0.5
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
patchedDependencies:
  "@tanstack/history@1.162.5": patches/@tanstack+history@1.162.5.patch
  "@tanstack/router-core@1.171.39": patches/@tanstack+router-core@1.171.39.patch
  "@tanstack/react-router@1.170.46": patches/@tanstack+react-router@1.170.46.patch
  flexlayout-react@0.11.1: patches/flexlayout-react@0.11.1.patch

# Vite+ Core exposes Vite 8 APIs under the Vite+ version.
peerDependencyRules:
  allowedVersions:
    vite: 1.4.0

minimumReleaseAgeExclude:
  - "@tanstack/history@1.162.5"
  - "@tanstack/react-router@1.170.46"
  - "@tanstack/router-core@1.171.39"
  - "@voidzero-dev/vite-plus-core@1.4.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.4.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.4.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.4.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.4.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.4.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.4.0"
  - vite-plus@1.4.0
catalogs:
  build:
    vite-plus: 1.4.0
  dev:
    capnweb: 0.12.0
    jsdom: ^30.1.3
  frontend:
    "@tanstack/react-hotkeys": ^0.22.0
    flexlayout-react: 0.11.1
    "@tanstack/react-router": 1.170.46
    "@tanstack/react-store": ^0.11.2
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    react: ^19.3.1
    react-dom: ^19.3.1
  test:
    "@playwright/test": ^1.64.1
    "@testing-library/react": ^16.3.3
    vitest: 5.0.5
  tooling:
    "@types/node": ^26.6.6
    "@vitejs/plugin-react": ^6.2.1
    pncat: ^0.13.4
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  internal:
    "@worksplit/split-view": workspace:*
  peer:
    "@tanstack/react-router": 1.170.46
    flexlayout-react: 0.11.1
