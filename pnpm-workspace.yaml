packages:
  - "packages/*"
allowBuilds:
  core-js: false
  es5-ext: false
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.2.0
patchedDependencies:
  flexlayout-react@0.11.1: patches/flexlayout-react@0.11.1.patch

# Vite+ Core exposes Vite 8 APIs under the Vite+ version.
peerDependencyRules:
  allowedVersions:
    vite: 1.2.0

minimumReleaseAgeExclude:
  - "@tanstack/history@1.162.5"
  - "@tanstack/react-router@1.170.42"
  - "@tanstack/router-core@1.171.35"
  - "@voidzero-dev/vite-plus-core@1.2.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.2.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.2.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.2.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.2.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.2.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.2.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.2.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.2.0"
  - vite-plus@1.2.0
catalogs:
  build:
    vite-plus: 1.2.0
  dev:
    jsdom: ^30.1.2
  frontend:
    flexlayout-react: ^0.11.1
    "@tanstack/react-router": ^1.170.42
    "@tanstack/react-store": ^0.11.2
    "@tanstack/react-hotkeys": ^0.13.0
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    react: ^19.3.0
    react-dom: ^19.3.0
  test:
    "@playwright/test": ^1.64.0
    "@testing-library/react": ^16.3.3
    vitest: 5.0.4
  tooling:
    "@types/node": ^26.6.4
    "@vitejs/plugin-react": ^6.1.2
    pncat: ^0.13.4
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.2.0
